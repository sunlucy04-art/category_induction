<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Simple Painting Experiment Proportion Version</title>

  <!-- jsPsych: runs the experiment -->
  <script src="https://unpkg.com/jspsych@8.2.1"></script>
  <link href="https://unpkg.com/jspsych@8.2.1/css/jspsych.css" rel="stylesheet">

  <!-- Plugins used in this experiment -->
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@2.1.0"></script>

  <!-- PapaParse reads the CSV trial list -->
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 18px;
      line-height: 1.25;
      margin: 0;
    }

    .page {
      max-width: 940px;
      margin: auto;
    }

    .page p {
      margin: 8px 0;
    }

    .trial-page {
      padding-top: 6px;
    }

    .example-board {
      width: 760px;
      max-width: 95vw;
      margin: 0 auto 4px;
      border: 2px solid #111;
      box-sizing: border-box;
      background: white;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 16px;
    }

    .example-board-title {
      font-family: Georgia, serif;
      font-weight: bold;
      font-size: 24px;
      margin: 0 0 4px;
      line-height: 1;
    }

    .example-item {
      width: 100%;
      height: 90px;
      object-fit: contain;
    }

    .new-painting {
      width: 210px;
      max-width: 90%;
      max-height: 155px;
      object-fit: contain;
      margin: 4px 0 8px;
    }

    .choice-img {
      width: 190px;
      height: 135px;
      object-fit: contain;
    }

    .jspsych-btn {
      margin: 6px 18px;
      padding: 8px 14px;
      background: white;
      border: 2px solid #333;
      cursor: pointer;
    }

    .jspsych-content {
      max-width: 1000px;
    }

    #jspsych-html-button-response-btngroup {
      margin-top: 0;
    }

    .jspsych-btn:hover {
      background: #f2f2f2;
    }
  </style>

  <!-- Everything else (reading the trial list, building the timeline) lives in experiment.js -->
  <script src="experiment.js"></script>
</head>
<body>
  <script>
    runExperiment();
  </script>
</body>
</html>
